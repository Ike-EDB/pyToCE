[build-system]
requires = ["setuptools==84.2.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoce"
version = "1.0.0"
description = "Python package for target-driven circular economy planning through absolute environmental sustainability assessment (AESA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
authors = [
  { name = "Erwan Ike de Bantel", email = "erwan.de-bantel@centralesupelec.fr" },
]
keywords = [
  "life cycle assessment",
  "material flow analysis",
  "plastics",
  "circular economy",
  "prospective LCA",
  "industrial ecology",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas==2.3.3",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pyarrow==24.0.0",
  "bw_timex[solvers]==1.1.2",
  "bw_temporalis==1.2.0",
  "bw2data==4.7",
  "bw2io==0.9.17",
  "bw2calc==2.5.0",
  "premise==2.4.6",
  "flodym==0.8.1",
  "pyam-iamc==3.0.0",
  "ixmp4==0.11.1",
  "openpyxl==3.1.5",
  "py7zr==1.1.3",
  "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/Ike-EDB/pyToCE"
Repository = "https://github.com/Ike-EDB/pyToCE"
Issues = "https://github.com/Ike-EDB/pyToCE/issues"

[project.optional-dependencies]
article-support = [
  "matplotlib==3.11.1",
]
dev = [
  "build==1.5.0",
  "setuptools==84.2.1",
  "wheel==0.47.0",
  "jsonschema==4.26.0",
  "matplotlib==3.11.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "pytest-xdist==3.8.0",
  "coverage[toml]==7.10.7",
  "ruff==0.15.18",
  "pyright==1.1.405",
  "pandas-stubs==2.3.3.260113",
  "types-PyYAML==6.0.12.20260815",
  "types-pytz==2026.3.1.20260727",
]
docs = [
  "Sphinx==8.2.3",
  "myst-parser==4.0.1",
  "nbsphinx==0.9.8",
  "nbsphinx-link==1.3.1",
  "pypandoc-binary==1.17",
  "sphinx-rtd-theme==3.1.0",
  "nbformat==5.10.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "*.ipynb",
  "build",
  "docs/_build",
  "tmp",
]

[tool.ruff.lint]
extend-select = ["E501", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pytoce"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src/pytoce"]
pythonVersion = "3.11"

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]
source = ["pytoce"]

[tool.coverage.paths]
source = [
  "src/pytoce",
  "*/src/pytoce",
  "*/site-packages/pytoce",
  "*/installed/pytoce",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not scientific_integration'"
markers = [
  "scientific_integration: long-running package scientific integration checks excluded from the ordinary suite",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytoce*"]

[tool.setuptools.package-data]
pytoce = [
  "py.typed",
  "**/ARCHITECTURE*.md",
  "set_workspace/data/*.json",
  "download_data/data/*.json",
  "download_data/data/*.md",
  "run_mfa/data/*.json",
  "run_mfa/data/catalogues/*.json",
  "run_mfa/data/catalogues/*.csv",
  "run_mfa/data/schemas/*.json",
  "run_mfa/data/workspace/data_raw/foreground_scenarios/default_inputs/*.json",
  "run_mfa/data/workspace/data_raw/foreground_scenarios/default_inputs/*.parquet",
  "run_mfa/data/workspace/data_raw/foreground_scenarios/scenarios/*.yaml",
  "run_mfa/data/workspace/data_raw/foreground_scenarios/templates/*.md",
  "run_mfa/data/workspace/data_raw/foreground_scenarios/templates/*.yaml",
  "run_mfa/data/workspace/data_raw/foreground_scenarios/templates/examples/*.yaml",
  "prepare_backgrounds/data/*.json",
  "prepare_backgrounds/data/*.csv",
  "prepare_backgrounds/data/*.txt",
  "prepare_backgrounds/data/provider_recipes/*.json",
  "prepare_backgrounds/data/provider_recipes/*.csv",
  "run_lca/data/*.json",
  "run_asr/data/*.json",
  "run_optimization/data/*.json",
  "run_optimization/data/schemas/*.json",
  "run_optimization/data/workspace/data_raw/allocated_cc/templates/*.md",
  "run_optimization/data/workspace/data_raw/allocated_cc/templates/*.yaml",
  "run_optimization/data/workspace/data_raw/allocated_cc/templates/*.csv",
  "set_workspace/data/methodological_notes/*.txt",
  "set_workspace/data/methodological_notes/*.pdf",
  "set_workspace/data/methodological_notes/*.xlsx",
]
