name: Deploy to TestPyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish distribution to TestPyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.publish == 'true'
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect the exact candidate
        run: |
          python -m pip install build==1.5.0 setuptools==84.2.1 wheel==0.47.0
          python -m build
          python tests/package/verify_release_artifacts.py dist
      - name: Store distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    if: >-
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.publish == 'true'
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pytoce
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
