name: Package Tests

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Package test scope
        required: true
        type: choice
        default: lite
        options:
          - lite
          - full
      python_version:
        description: Python version for full scope (validate 3.12 first)
        required: true
        type: choice
        default: "3.12"
        options:
          - "3.12"
          - "3.11"

concurrency:
  group: package-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  test-lite:
    if: github.event.inputs.test_scope == 'lite'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test requirements
        run: python -m pip install ".[dev]"
      - name: Create the disposable Brightway store
        run: python -c "import os; from pathlib import Path; path = Path(os.environ['RUNNER_TEMP']) / 'brightway'; path.mkdir(parents=True, exist_ok=True); Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write(f'BRIGHTWAY2_DIR={path}\n')"
      - name: Provision public REMIND-MFA 0.2.0 source
        run: python tests/provision_remind_mfa_source.py
      - name: Run the ordinary suite
        run: >-
          python -m pytest -q -n 1 --dist=loadfile --max-worker-restart=0
          --durations=25 tests/unit tests/integration
          --basetemp="${{ runner.temp }}/pytest-ordinary"

  test-full:
    if: github.event.inputs.test_scope == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      COVERAGE_FILE: ${{ github.workspace }}/coverage-data-${{ matrix.os }}-${{ inputs.python_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: ""
          - os: windows-latest
            tests: tests/unit tests/integration
          - os: macos-15
            tests: >-
              tests/unit/run_lca/test_timex_inventory_solver.py
              tests/unit/test_filesystem.py
              tests/unit/download_data/test_source_reuse.py
              tests/unit/run_optimization/test_allocated_cc.py
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
      - name: Install the native Apple Silicon solver prerequisites
        if: runner.os == 'macOS'
        run: brew install suite-sparse swig pkg-config
      - name: Install package and test requirements
        run: python -m pip install ".[dev,docs]"
      - name: Create the disposable Brightway store
        run: python -c "import os; from pathlib import Path; path = Path(os.environ['RUNNER_TEMP']) / 'brightway'; path.mkdir(parents=True, exist_ok=True); Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write(f'BRIGHTWAY2_DIR={path}\n')"
      - name: Provision public REMIND-MFA 0.2.0 source
        if: runner.os != 'macOS'
        run: python tests/provision_remind_mfa_source.py
      - name: Install PDF inspection tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Verify the supported native non-Pardiso backend
        if: runner.os == 'macOS'
        shell: python
        run: |
          import platform
          import bw2calc

          assert platform.system() == "Darwin" and platform.machine() == "arm64"
          assert not bw2calc.PYPARDISO
      - name: Collect ordinary package coverage
        if: runner.os != 'macOS'
        run: >-
          python -m pytest -q -n 1 --dist=loadfile --max-worker-restart=0
          -m "not scientific_integration" tests/unit tests/integration --durations=25
          --basetemp="${{ runner.temp }}/pytest-ordinary"
          --cov=pytoce --cov-branch --cov-fail-under=0
          --cov-config="${{ github.workspace }}/pyproject.toml"
          --cov-report=term-missing
      - name: Collect bounded scientific integration coverage
        if: runner.os != 'macOS'
        run: >-
          python -m pytest -q -n 0 -m scientific_integration tests/unit tests/integration
          --durations=25 --basetemp="${{ runner.temp }}/pytest-scientific"
          --cov=pytoce --cov-branch --cov-append --cov-fail-under=0
          --cov-config="${{ github.workspace }}/pyproject.toml"
          --cov-report=term-missing
      - name: Collect documentation and artifact coverage
        if: runner.os == 'Linux'
        run: >-
          python -m pytest -q -n 0 -m "" tests/docs tests/package
          --basetemp="${{ runner.temp }}/pytest-docs-package"
          --cov=pytoce --cov-branch --cov-append --cov-fail-under=0
          --cov-config="${{ github.workspace }}/pyproject.toml"
          --cov-report=term-missing
      - name: Collect native solver coverage
        if: runner.os == 'macOS'
        run: >-
          python -m pytest -q -n 0 -m "" ${{ matrix.tests }} --durations=25
          --basetemp="${{ runner.temp }}/pytest-native-solver"
          --cov=pytoce --cov-branch --cov-fail-under=0
          --cov-config="${{ github.workspace }}/pyproject.toml"
          --cov-report=term-missing
      - name: Upload native coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-${{ matrix.os }}-${{ inputs.python_version }}
          path: coverage-data-${{ matrix.os }}-${{ inputs.python_version }}
          if-no-files-found: error

  coverage:
    needs: test-full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install coverage 7.10.7
        run: python -m pip install coverage==7.10.7
      - name: Download this Python version's native coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-data-*-${{ inputs.python_version }}
          merge-multiple: true
          path: coverage-inputs/
      - name: Combine genuine platform measurements
        shell: python
        env:
          COVERAGE_PYTHON: ${{ inputs.python_version }}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          version = os.environ["COVERAGE_PYTHON"]
          expected = {
              f"coverage-data-{platform}-{version}"
              for platform in ("ubuntu-latest", "windows-latest", "macos-15")
          }
          files = sorted(Path("coverage-inputs").iterdir())
          assert {path.name for path in files} == expected
          subprocess.run(
              [sys.executable, "-m", "coverage", "combine", "--keep", *map(str, files)],
              check=True,
          )
          # Emit all diagnostics before the exact line/branch acceptance check.
          for report in ("xml", "html", "report"):
              subprocess.run(
                  [sys.executable, "-m", "coverage", report, "--fail-under=0"],
                  check=True,
              )
      - name: Write coverage summary
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          lines_covered = int(root.get("lines-covered", "0"))
          lines_valid = int(root.get("lines-valid", "0"))
          branches_covered = int(root.get("branches-covered", "0"))
          branches_valid = int(root.get("branches-valid", "0"))
          line_rate = (lines_covered / lines_valid * 100) if lines_valid else 0.0
          branch_rate = (
              branches_covered / branches_valid * 100 if branches_valid else 100.0
          )
          summary = [
              "## Coverage Summary",
              "",
              f"- Line coverage: {line_rate:.2f}% ({lines_covered}/{lines_valid})",
              f"- Branch coverage: {branch_rate:.2f}% ({branches_covered}/{branches_valid})",
              "- Artifacts: `coverage.xml` and `htmlcov/`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          if not (lines_valid > 0 and lines_covered == lines_valid
                  and branches_valid > 0 and branches_covered == branches_valid):
              raise SystemExit("Package line and branch coverage must both be 100%.")
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-combined-${{ inputs.python_version }}
          path: |
            coverage.xml
            htmlcov/
