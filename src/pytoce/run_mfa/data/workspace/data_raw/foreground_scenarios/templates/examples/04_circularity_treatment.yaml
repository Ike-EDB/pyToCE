schema_version: pytoce_foreground_scenario_schema_v1
foreground_scenario: example_circularity_treatment
ssp_scenario: SSP2
description: Collection target and treatment shares of collected waste after trade.
changes:
  - parameter: collection_rate
    selector: uniform_all_h12
    trajectory:
      mode: linear_from_2019
      target_year: 2050
      target_mode: absolute
      target_value: 0.80
  - parameter_group: collected_waste_treatment_shares
    selector: uniform_all_h12
    trajectory:
      mode: linear_from_2019
      target_year: 2050
      target_values:
        mechanical_recycling_rate: 0.40
        chemical_recycling_rate: 0.10
        incineration_rate: 0.30
        landfill_share: 0.20
