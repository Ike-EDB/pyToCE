schema_version: pytoce_foreground_scenario_schema_v1
foreground_scenario: replace_with_unique_snake_case_name
ssp_scenario: SSP2
description: Non-executable skeleton; copy, rename, and edit before running.
changes:
  # Exact-coordinate example with two persistent rules.
  - parameter: collection_rate
    region: EUR
    changes:
      - year: 2025
        mode: retain_2019
      - year: 2050
        mode: absolute
        value: 0.75
        interpolation: step

  # Explicit broad selectors are parameter-specific. This relative stock rule
  # applies to every world region/good coordinate.
  - parameter: stock_projection
    selector: uniform_all_h12_goods
    changes:
      - year: 2030
        mode: multiplier_from_default
        value: 1.0

  # One linear trajectory starts at the exact 2019 coordinate, reaches the
  # target in the selected year, and then persists.
  - parameter: lifetime_mean
    good: Packaging
    trajectory:
      mode: linear_from_2019
      target_year: 2050
      target_mode: absolute
      target_value: 5.0

  # Provide every share in the group; the values must sum to one.
  - parameter_group: collected_waste_treatment_shares
    selector: uniform_all_h12
    trajectory:
      mode: linear_from_2019
      target_year: 2050
      target_values:
        mechanical_recycling_rate: 0.40
        chemical_recycling_rate: 0.10
        incineration_rate: 0.30
        landfill_share: 0.20
