schema_version: pytoce_foreground_scenario_schema_v1
foreground_scenario: example_waste_trade
ssp_scenario: SSP2
description: >-
  From 2030, EUR import requests retain the 2019 import-to-collection ratio, applied
  to current local collection before trade. EUR and USA export requests retain their
  2019 masses. The model then balances global imports and exports.
changes:
  - parameter: waste_imports
    region: EUR
    changes:
      - year: 2030
        mode: retain_2019_propensity_pretrade_collected
  - parameter: waste_exports
    regions:
      - EUR
      - USA
    changes:
      - year: 2030
        mode: multiplier_from_2019
        value: 1.0
